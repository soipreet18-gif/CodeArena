<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | CodeArena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset-password.css">
</head>
<body>
    <div class="image">
        <div class="nav">
            <nav>
                <ul>
                    <li><a href="index.html" id="CodeArena">CodeArena</a></li>
                </ul>
            </nav>
        </div>
        <div class="main-content">
        <div class="lock-icon">
            <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 100 100"
        width="65"
        height="65"
        fill="none"
    >
        <rect
            x="27"
            y="43"
            width="46"
            height="38"
            rx="7"
            stroke="#FFFFFF"
            stroke-width="3"
        />

        <path
            d="M35 43 V32
               C35 12 65 12 65 32
               V43"
            stroke="#FFFFFF"
            stroke-width="3"
            stroke-linecap="round"
        />

        <circle
            cx="50"
            cy="58"
            r="4"
            fill="#FFFFFF"
        />

        <path
            d="M50 62 V70"
            stroke="#FFFFFF"
            stroke-width="3"
            stroke-linecap="round"
        />
    </svg>
</div>
            <h1>Create New Password</h1>
            <p>Your new password must be different <br> from your previous one.</p>
            <label for="new-pass"></label>
            <input type="password" name="new-pass" id="new-pass" placeholder="New Password" required>
            <label for="confirm-pass"></label>
            <input type="password" name="confirm-pass" id="confirm-pass" placeholder="Confirm New password" required>
            <div class="requirements">
                <p>Password Requirements:</p>
                <ul>
                    <li>At least 8 characters</li>
                    <li>Include uppercase and lowercase letters</li>
                    <li>Include a number</li>   
                    <li>Include a speacial character</li>
                </ul>
            </div>
            <button type="submit" id="reset-password" required><a href="#" class="Update">Update Password</a></button>
            <a href="login.html" id="login">&larr; Back to Login</a>
        </div>
    </div>
</body>
</html>
