<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CodeArena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
    <div class="bg-image">
        <div class="nav">
                <nav>
                    <ul>
                        <li><a id="CodeArena" href="index.html">CodeArena</a></li>
                    </ul>
                </nav>
            </div>
        <div class="svg"></div>
        <div class="content">
             <div class="main-content">
                <h1>Forgot Password?</h1>
                <p>No worries, we'll send you reset instructions.</p>
                <form action="index.html">
                    <label for="email"></label>
                    <input type="email" name="email" id="email" placeholder="Enter your email" required>
                    <button type="submit" id="reset-password" required><a href="reset-password.html" id="reset">Reset Password</a></button>
                    <a id="login" href="login.html">&larr; Back to log in</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
