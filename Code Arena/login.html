<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeArena</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-image">
        <div class="nav-bar">
            <nav>
                <ul>
                    <li><a href="index.html">CodeArena</a></li>
                </ul>
            </nav>
        </div>
        <div class="login-page">
            <div class="main-content">
                <h2>Welcome <span>Back!</span></h2>
                <p class="description">Login to continue your coding journey <br> and unlock new challenges.</p>
            </div>
                <div class="login-content">
                    <p class="login">Login to your account</p>
                    <form action="index.html">
                        <label for="email"></label>
                        <input type="email" name="email" id="email" placeholder="Email Address" required>
                        <label for="password"></label>
                        <input type="password" name="password" id="password" placeholder="Password" required>
                        <div class="form-options">
                            <label id="checkbox">
                                <input type="checkbox">
                                Remember me
                            </label>

                            <a href="forgot-password.html" class="forgot">Forgot Password?</a>
                        </div>

                    <button type="submit">Login</button>

                    <p class="signup-text">
                        Don't have an account?
                        <a href="signup.html">Sign Up</a>
                    </p>
                    </form>
                </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
