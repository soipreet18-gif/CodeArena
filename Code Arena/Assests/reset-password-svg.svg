<svg xmlns="http://w3.org" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feFlood flood-color="#7c5cff" flood-opacity="0.9" result="glowColor" />
      <feComposite in="glowColor" in2="blur2" operator="in" result="coloredBlur2" />
      <feComposite in="glowColor" in2="blur1" operator="in" result="coloredBlur1" />
      <feMerge>
        <feMergeNode in="coloredBlur2" />
        <feMergeNode in="coloredBlur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Outer Ring Glow -->
    <filter id="ring-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Optional Dark Background (Remove this rect for a transparent background) -->
  <rect width="100%" height="100%" fill="#282b57" rx="16" />

  <!-- Outer Glowing Circle -->
  <circle 
    cx="120" 
    cy="120" 
    r="92" 
    fill="none" 
    stroke="#8b75ff" 
    stroke-width="2.5" 
    filter="url(#ring-glow)" 
  />

  <!-- Glowing Padlock Group -->
  <g filter="url(#neon-glow)">
    <!-- Padlock Shackle (Top Arch) -->
    <path 
      d="M 96 105 V 80 A 24 24 0 0 1 144 80 V 105" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="7" 
      stroke-linecap="round" 
    />

    <!-- Padlock Body -->
    <rect 
      x="80" 
      y="105" 
      width="80" 
      height="62" 
      rx="10" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="7" 
    />

    <!-- Keyhole Circle -->
    <circle cx="120" cy="130" r="5.5" fill="#ffffff" />

    <!-- Keyhole Slot -->
    <line 
      x1="120" 
      y1="133" 
      x2="120" 
      y2="147" 
      stroke="#ffffff" 
      stroke-width="5" 
      stroke-linecap="round" 
    />
  </g>
</svg>
